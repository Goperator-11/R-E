name: Development checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.4"
          cache: pip
      - run: python -I -B -m pip install -r requirements.txt
      - run: python -I -B tools/lint_ast.py
      - run: python -I -B -m pytest -q -p no:cacheprovider
      - run: echo "GOPATH=$HOME/gopath" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache-dependency-path: experiments/quicbed/go.sum
      - run: test "$(go env GOPATH)" = "$HOME/gopath" && go mod download
        working-directory: experiments/quicbed
      - run: bash experiments/quicbed/build_gen33.sh
